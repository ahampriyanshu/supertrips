      <linearGradient id="cubic-basalt" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#59524c" />
        <stop offset="50%" stop-color="#706861" />
        <stop offset="100%" stop-color="#4a433e" />
      </linearGradient>
    
