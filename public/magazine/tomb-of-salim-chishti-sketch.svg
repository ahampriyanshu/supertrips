        <stop offset="50%" stop-color="#c45d45" />
        <stop offset="100%" stop-color="#993824" />
      </linearGradient>
      <radialGradient id="marble-dome" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="55%" stop-color="#f2ece1" />
        <stop offset="100%" stop-color="#bfb1a3" />
      </radialGradient>
    
