<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
<defs>
      <filter id="pencil-jitter" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <pattern id="hatch-shadow" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="5" stroke="#2b201d" stroke-width="0.95" opacity="0.45" />
      </pattern>
      <pattern id="hatch-water" width="14" height="7" patternUnits="userSpaceOnUse">
        <path d="M 0,3.5 Q 3.5,1.5 7,3.5 T 14,3.5" fill="none" stroke="#3d6360" stroke-width="0.75" opacity="0.4" />
      </pattern>
      
      <pattern id="hatch-buff" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#a36040" stroke-width="0.8" opacity="0.38" />
      </pattern>
      <pattern id="hatch-white" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#80756d" stroke-width="0.65" opacity="0.3" />
      </pattern>
      <linearGradient id="sky-wash" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#b8cfe0" stop-opacity="0.85" />
        <stop offset="60%" stop-color="#e8f0f5" stop-opacity="0.5" />
        <stop offset="100%" stop-color="#faf5ec" stop-opacity="0.9" />
      </linearGradient>
      <radialGradient id="marble-dome" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="60%" stop-color="#ede6da" />
        <stop offset="100%" stop-color="#c2b4a3" />
      </radialGradient>
      <linearGradient id="buff-sandstone" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ba6645" />
        <stop offset="45%" stop-color="#d47f5b" />
        <stop offset="80%" stop-color="#ba6645" />
        <stop offset="100%" stop-color="#994d30" />
      </linearGradient>
    
