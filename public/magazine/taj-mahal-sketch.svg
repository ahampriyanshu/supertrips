        <stop offset="50%" stop-color="#f7f3ec" />
        <stop offset="85%" stop-color="#ded4c5" />
        <stop offset="100%" stop-color="#b8aa98" />
      </radialGradient>
      <linearGradient id="marble-facade" x1="0%" y1="0%" x2="100%" y2="0%">
